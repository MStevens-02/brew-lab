<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brew Lab</title>
<meta name="description" content="Brew Lab: in-depth home brewing guides, calculators, recipes and a batch log for beer, wine, cider and mead.">
<meta name="theme-color" content="#110d0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
<script>
  // Apply theme + text size before first paint
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('bl.theme') || '"auto"');
      var s = JSON.parse(localStorage.getItem('bl.textsize') || '"m"');
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      if (s !== 'm') document.documentElement.classList.add('ts-' + s);
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  })();
</script>
</head>
<body>
<noscript>Brew Lab needs JavaScript turned on.</noscript>
<script src="js/calc.js"></script>
<script src="js/data.js"></script>
<script src="js/guides.js"></script>
<script src="js/recipes.js"></script>
<script src="js/core.js"></script>
<script src="js/calcs.js"></script>
<script src="js/tools.js"></script>
<script src="js/juice.js"></script>
<script src="js/paths.js"></script>
<script src="js/beginner.js"></script>
<script src="js/extras.js"></script>
<script src="js/more.js"></script>
<script src="js/app.js"></script>
</body>
</html>
